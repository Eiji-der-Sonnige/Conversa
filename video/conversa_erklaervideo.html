<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversa Erklärvideo</title>
<style>
  html, body { margin: 0; height: 100%; background: #040c15; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 12px; font-family: "Segoe UI", system-ui, sans-serif; color: #eaf4ff; }
  canvas { width: min(100vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; }
  #bar { display: flex; align-items: center; gap: 12px; width: min(100vw - 32px, 900px); }
  #bar button { background: #20b2a6; color: #04121c; border: 0; border-radius: 8px; padding: 8px 16px;
                font: 600 15px "Segoe UI", sans-serif; cursor: pointer; min-width: 90px; }
  #bar input { flex: 1; accent-color: #20b2a6; }
  #bar select { background: #102539; color: #eaf4ff; border: 1px solid #26405a; border-radius: 8px; padding: 7px 8px; font: 14px "Segoe UI", sans-serif; }
  #bar span { font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; font-size: 14px; color: #8fa6bf; }
  body.render { display: block; }
  body.render #bar { display: none; }
  body.short canvas { width: min(100vw, calc((100vh - 70px) * 9 / 16)); aspect-ratio: 9 / 16; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="play">Abspielen</button>
  <select id="lang"><option value="de">Deutsch</option><option value="en">English</option></select>
  <select id="fmt"><option value="wide">16:9</option><option value="short">9:16 (Short)</option></select>
  <input id="seek" type="range" min="0" max="60" step="0.01" value="0">
  <span id="time"></span>
</div>
<script>
const PARAMS = new URLSearchParams(location.search);
const S = PARAMS.get('format') === 'short';   // 9:16 für YouTube Shorts
const W = S ? 1080 : 1920, H = S ? 1920 : 1080;
const LANG = PARAMS.get('lang') === 'en' ? 'en' : 'de';
document.documentElement.lang = LANG;
// Szenenlängen in Sekunden je Sprache (werden von build_audio.py an die Sprecherstimme angepasst)
const TIMINGS = {"de": [8.13, 10.64, 11.12, 10.62, 7.11, 9.13, 14.92], "en": [8.73, 11.72, 12.15, 10.35, 7.21, 9.66, 15.26]};
const DURS = TIMINGS[LANG];
const BASE_DURS = [5, 6.5, 9.5, 7.5, 6, 6, 5.5];  // Länge, für die die Animationen gebaut sind
const EN = {
 "Der dezentrale Messenger für deine Privatsphäre": "The decentralized messenger for your privacy",
 "Ende-zu-Ende-verschlüsselt": "End-to-end encrypted",
 "Dezentral": "Decentralized",
 "Anmelden ohne persönliche Daten": "Sign in without personal data",
 "Kein Konto bei einem Anbieter – nur Benutzername und Passwort": "No account with a provider – just a username and password",
 "Benutzername": "Username",
 "Passwort": "Password",
 "Anmelden": "Sign in",
 "Angemeldet": "Signed in",
 "Keine E-Mail-Adresse": "No email address",
 "Keine Telefonnummer": "No phone number",
 "Nur Benutzername + Passwort": "Just username + password",
 "Optional: Zwei-Faktor-Code (TOTP)": "Optional: two-factor code (TOTP)",
 "Nur Absender und Empfänger können die Nachricht lesen": "Only sender and recipient can read the message",
 "Hallo Sam!": "Hi Sam!",
 "Nachricht …": "Message …",
 "Nostr-Relay": "Nostr relay",
 "von Dritten betrieben": "run by third parties",
 "wird verschlüsselt …": "encrypting …",
 "Das Relay sieht nur:": "The relay only sees:",
 "Verschlüsselt mit Nostr NIP-44  ·  Absender verborgen durch Gift-Wrap (NIP-17 / NIP-59)": "Encrypted with Nostr NIP-44  ·  sender hidden by gift wrap (NIP-17 / NIP-59)",
 "Dezentral – ohne zentralen Server": "Decentralized – no central server",
 "Nachrichten laufen über mehrere unabhängige Relays": "Messages travel through several independent relays",
 "Ein Relay fällt aus? Die anderen übernehmen.": "A relay goes down? The others take over.",
 "Relays und Medien-Server (Blossom) sind frei wählbar und austauschbar": "Relays and media servers (Blossom) can be freely chosen and replaced",
 "Sprach- und Videoanrufe": "Voice and video calls",
 "Direkt von Gerät zu Gerät – Peer-to-Peer": "Directly from device to device – peer-to-peer",
 "Relay: nur Verbindungsaufbau": "Relay: call setup only",
 "WebRTC  ·  verschlüsselt mit DTLS-SRTP": "WebRTC  ·  encrypted with DTLS-SRTP",
 "Verbinde …": "Connecting …",
 "Mit eigenem TURN-Server sieht dein Gesprächspartner deine IP-Adresse nicht": "With your own TURN server, the other person can’t see your IP address",
 "Und außerdem": "And there’s more",
 "Zwei-Faktor-Schutz": "Two-factor protection",
 "TOTP, z. B. Google Authenticator": "TOTP, e.g. Google Authenticator",
 "Tor-Unterstützung": "Tor support",
 "Optional über Orbot": "Optional via Orbot",
 "Kein Tracking": "No tracking",
 "Keine Werbung, keine Analyse": "No ads, no analytics",
 "Ohne Google-Dienste": "No Google services",
 "Braucht kein Google Play": "Doesn’t need Google Play",
 "Verschlüsselte Medien": "Encrypted media",
 "Bilder und Videos Ende-zu-Ende": "Photos and videos, end-to-end",
 "Kostenlos  ·  ab Android 13  ·  APK direkt von GitHub": "Free  ·  Android 13+  ·  APK straight from GitHub",
 "Kostenlos und quelloffen – jetzt auf GitHub": "Free and open source – now on GitHub",
 "Nur für Android": "Android only",
 "Nur für Android (ab Version 13) – keine iPhone-Version": "Android only (version 13+) – no iPhone version",
 "Nicht-kommerzielles Hobbyprojekt  ·  kein unabhängiges Sicherheits-Audit  ·  Nutzung auf eigenes Risiko": "Non-commercial hobby project  ·  no independent security audit  ·  use at your own risk"
};
const tr = s => (LANG === 'en' && EN[s] !== undefined) ? EN[s] : s;
const DUR = DURS.reduce((a, b) => a + b, 0);
const STARTS = DURS.map((_, i) => DURS.slice(0, i).reduce((a, b) => a + b, 0));
window.DUR = DUR;
const RENDER = PARAMS.has('render');
if (RENDER) document.body.classList.add('render');
if (S) document.body.classList.add('short');

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
if (RENDER) { cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
const x = cv.getContext('2d');

const logo = new Image();
logo.src = 'conversa_logo.png';

const C = {
  bg0: '#06111c', bg1: '#0c2134', text: '#eaf4ff', muted: '#8fa6bf', teal: '#20b2a6', cyan: '#35d6c6',
  blue: '#2f7cf6', red: '#ff5a6a', green: '#3ddc97', card: '#102539', line: '#26405a', phone: '#17222f',
  screen: '#0d1926', bubbleIn: '#22364d', android: '#3ddc84',
};
const FONT = '"Segoe UI", system-ui, sans-serif';

// ---------- Hilfsfunktionen ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, v) => a + (b - a) * v;
const eo = v => 1 - Math.pow(1 - v, 3);
const eio = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const back = v => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(v - 1, 3) + c1 * Math.pow(v - 1, 2); };
const rand = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function font(size, weight = 400) { x.font = `${weight} ${size}px ${FONT}`; }
function wrapLines(s, size, w, maxW) {
  font(size, w);
  if (!maxW || x.measureText(s).width <= maxW) return [s];
  const lines = []; let cur = '';
  for (const word of s.split(' ').filter(Boolean)) {
    const t = cur ? cur + ' ' + word : word;
    if (cur && x.measureText(t).width > maxW) { lines.push(cur); cur = word; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines.map(l => l.replace(/^·\s*/, '').replace(/\s*·$/, ''));
}
function text(s, X, Y, size, o = {}) {
  const { w = 400, color = C.text, align = 'center', alpha = 1, base = 'middle', maxW = 0, lh = 1.22 } = o;
  s = tr(s);
  x.save();
  const lines = wrapLines(s, size, w, maxW);
  x.globalAlpha *= alpha; font(size, w); x.fillStyle = color;
  x.textAlign = align; x.textBaseline = base;
  lines.forEach((l, i) => x.fillText(l, X, Y + (i - (lines.length - 1) / 2) * size * lh));
  x.restore();
  return lines.length;
}
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function circle(cx, cy, r) { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); }
function grad(x0, y0, x1, y1, a = C.teal, b = C.blue) {
  const g = x.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g;
}
function withAlpha(a, fn) { x.save(); x.globalAlpha *= clamp(a); fn(); x.restore(); }
function scaleAt(cx, cy, s, fn) { x.save(); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy); fn(); x.restore(); }

function drawLogo(cx, cy, size, alpha = 1) {
  if (!logo.complete || !logo.naturalWidth) return;
  withAlpha(alpha, () => x.drawImage(logo, cx - size / 2, cy - size / 2, size, size));
}

function lockIcon(cx, cy, s, open = 0, color = C.text) {
  x.save();
  x.strokeStyle = color; x.fillStyle = color; x.lineWidth = s * 0.13; x.lineCap = 'round';
  const lift = open * s * 0.32;
  x.beginPath();
  x.moveTo(cx - s * 0.28, cy - s * 0.05 - lift * 0.2);
  x.lineTo(cx - s * 0.28, cy - s * 0.25 - lift);
  x.arc(cx, cy - s * 0.25 - lift, s * 0.28, Math.PI, 0);
  x.lineTo(cx + s * 0.28, cy - s * 0.25 - lift + (open > 0 ? s * 0.12 : s * 0.2));
  x.stroke();
  rr(cx - s * 0.42, cy - s * 0.08, s * 0.84, s * 0.62, s * 0.12); x.fill();
  x.fillStyle = C.bg0; circle(cx, cy + s * 0.2, s * 0.08); x.fill();
  x.restore();
}

function checkIcon(cx, cy, r, prog, color = C.green) {
  x.save();
  circle(cx, cy, r); x.fillStyle = color; x.globalAlpha *= 0.18; x.fill(); x.globalAlpha /= 0.18;
  x.lineWidth = r * 0.14; x.strokeStyle = color; circle(cx, cy, r); x.stroke();
  const pts = [[cx - r * .42, cy + r * .02], [cx - r * .1, cy + r * .34], [cx + r * .46, cy - r * .3]];
  const pr = clamp(prog);
  x.lineWidth = r * 0.2; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(...pts[0]);
  if (pr < 0.4) x.lineTo(lerp(pts[0][0], pts[1][0], pr / .4), lerp(pts[0][1], pts[1][1], pr / .4));
  else { x.lineTo(...pts[1]); const q = (pr - .4) / .6; x.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  x.stroke(); x.restore();
}

function crossIcon(cx, cy, r, prog, color = C.red) {
  x.save();
  circle(cx, cy, r); x.fillStyle = color; x.globalAlpha *= 0.18; x.fill(); x.globalAlpha /= 0.18;
  x.lineWidth = r * 0.14; x.strokeStyle = color; circle(cx, cy, r); x.stroke();
  x.lineWidth = r * 0.2; x.lineCap = 'round';
  const d = r * 0.36, a = clamp(prog * 2), b = clamp(prog * 2 - 1);
  x.beginPath(); x.moveTo(cx - d, cy - d); x.lineTo(cx - d + 2 * d * a, cy - d + 2 * d * a); x.stroke();
  if (b > 0) { x.beginPath(); x.moveTo(cx + d, cy - d); x.lineTo(cx + d - 2 * d * b, cy - d + 2 * d * b); x.stroke(); }
  x.restore();
}

function serverIcon(cx, cy, s, color = C.cyan, t = 0, failed = false) {
  x.save();
  for (let i = 0; i < 3; i++) {
    const y = cy - s * 0.5 + i * s * 0.36;
    rr(cx - s * 0.55, y, s * 1.1, s * 0.28, s * 0.07);
    x.fillStyle = failed ? '#3a1d27' : '#16324a'; x.fill();
    x.lineWidth = 2.5; x.strokeStyle = failed ? C.red : color; x.stroke();
    const blink = failed ? 0.25 : 0.5 + 0.5 * Math.sin(t * 6 + i * 2);
    circle(cx + s * 0.38, y + s * 0.14, s * 0.045);
    x.fillStyle = failed ? C.red : C.green; x.globalAlpha *= 0.4 + 0.6 * blink; x.fill(); x.globalAlpha /= 0.4 + 0.6 * blink;
    x.fillStyle = failed ? '#6b3540' : '#2b5677';
    rr(cx - s * 0.42, y + s * 0.11, s * 0.5, s * 0.06, 3); x.fill();
  }
  x.restore();
}

function avatar(cx, cy, r, letter, a = C.teal, b = C.blue) {
  x.save();
  circle(cx, cy, r); x.fillStyle = grad(cx - r, cy - r, cx + r, cy + r, a, b); x.fill();
  text(letter, cx, cy + r * 0.04, r * 0.95, { w: 600 });
  x.restore();
}

function pill(cx, cy, s, size, o = {}) {
  const { fill = 'rgba(32,178,166,0.14)', stroke = C.teal, color = C.text, w = 500, padX = size * 0.9, h = size * 2.1 } = o;
  s = tr(s);
  font(size, w);
  const tw = x.measureText(s).width + padX * 2;
  rr(cx - tw / 2, cy - h / 2, tw, h, h / 2); x.fillStyle = fill; x.fill();
  x.lineWidth = 2; x.strokeStyle = stroke; x.stroke();
  text(s, cx, cy + 1, size, { w, color });
  return tw;
}

function phone(cx, cy, w, h, draw) {
  x.save();
  x.shadowColor = 'rgba(0,0,0,0.5)'; x.shadowBlur = 60; x.shadowOffsetY = 24;
  rr(cx - w / 2, cy - h / 2, w, h, w * 0.14); x.fillStyle = C.phone; x.fill();
  x.shadowColor = 'transparent';
  x.lineWidth = 3; x.strokeStyle = '#33485f'; x.stroke();
  const m = w * 0.045, sx = cx - w / 2 + m, sy = cy - h / 2 + m, sw = w - 2 * m, sh = h - 2 * m;
  rr(sx, sy, sw, sh, w * 0.11); x.fillStyle = C.screen; x.fill();
  x.save(); rr(sx, sy, sw, sh, w * 0.11); x.clip(); draw(sx, sy, sw, sh); x.restore();
  circle(cx, sy + 16, 6); x.fillStyle = '#03070c'; x.fill();
  x.restore();
}

function chatHeader(sx, sy, sw, name, letter) {
  x.fillStyle = '#132538'; x.fillRect(sx, sy, sw, 96);
  avatar(sx + 50, sy + 58, 22, letter);
  text(name, sx + 86, sy + 58, 24, { w: 600, align: 'left' });
  lockIcon(sx + sw - 36, sy + 60, 22, 0, C.cyan);
}

function bubble(X, Y, s, mine, size = 24, alpha = 1, maxRight = null) {
  s = tr(s);
  withAlpha(alpha, () => {
    font(size, 500);
    const tw = x.measureText(s).width, w = tw + 36, h = size + 30;
    const bx = mine ? X - w : X;
    rr(bx, Y, w, h, [18, 18, mine ? 4 : 18, mine ? 18 : 4]);
    x.fillStyle = mine ? grad(bx, Y, bx + w, Y + h) : C.bubbleIn; x.fill();
    text(s, bx + 18, Y + h / 2 + 1, size, { w: 500, align: 'left' });
  });
}

function hexString(seed, n) {
  const h = '0123456789abcdef'; let s = '';
  for (let i = 0; i < n; i++) s += h[Math.floor(rand(seed * 13.7 + i * 3.3) * 16)];
  return s;
}

function title(lt, main, sub) {
  const a = eo(p(lt, 0.15, 0.85));
  if (!S) {
    text(main, W / 2, 128 + (1 - a) * 30, 64, { w: 700, alpha: a });
    if (sub) {
      const b = eo(p(lt, 0.45, 1.15));
      text(sub, W / 2, 196 + (1 - b) * 20, 32, { color: C.muted, alpha: b });
    }
    return;
  }
  const n = wrapLines(tr(main), 70, 700, 960).length;
  const ty = 300 + (n - 1) * 43;
  text(main, W / 2, ty + (1 - a) * 30, 70, { w: 700, alpha: a, maxW: 960 });
  if (sub) {
    const b = eo(p(lt, 0.45, 1.15));
    const m = wrapLines(tr(sub), 36, 400, 940).length;
    text(sub, W / 2, ty + (n - 1) * 43 + 95 + (m - 1) * 22 + (1 - b) * 20, 36, { color: C.muted, alpha: b, maxW: 940 });
  }
}

function caption(lt, s, at, y) {
  const a = eo(p(lt, at, at + 0.6));
  if (S) text(s, W / 2, (y === undefined ? 1560 : y) + (1 - a) * 14, 32, { color: C.muted, alpha: a, maxW: 920 });
  else text(s, W / 2, (y === undefined ? 990 : y) + (1 - a) * 14, 28, { color: C.muted, alpha: a });
}

// ---------- Hintergrund ----------
const PARTS = [...Array(80)].map((_, i) => ({
  x: rand(i * 3.1), y: rand(i * 7.7), r: 1 + rand(i * 1.3) * 2.6, s: 8 + rand(i * 5.1) * 26, a: 0.15 + rand(i * 9.2) * 0.35,
}));
function background(t) {
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg0);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const glow = (gx, gy, r, col) => {
    const rg = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
  };
  glow(W * (0.25 + 0.06 * Math.sin(t * 0.25)), H * (0.3 + 0.05 * Math.cos(t * 0.2)), 760, 'rgba(32,178,166,0.16)');
  glow(W * (0.78 + 0.05 * Math.cos(t * 0.22)), H * (0.72 + 0.05 * Math.sin(t * 0.3)), 820, 'rgba(47,124,246,0.15)');
  for (const q of PARTS) {
    const yy = ((q.y * H - t * q.s) % H + H) % H, xx = q.x * W + Math.sin(t * 0.4 + q.y * 10) * 12;
    circle(xx, yy, q.r); x.fillStyle = `rgba(140,220,230,${q.a})`; x.fill();
  }
}

// ---------- Szenen ----------
function sceneIntro(lt) {
  const a = back(p(lt, 0.2, 1.2));
  const pulse = p(lt, 0.6, 2.4);
  const lx = W / 2, ly = S ? 640 : 400, ls = S ? 360 : 320;
  withAlpha((1 - pulse) * 0.6, () => {
    circle(lx, ly, ls * 0.53 + pulse * 260); x.lineWidth = 4; x.strokeStyle = C.cyan; x.stroke();
  });
  withAlpha(p(lt, 0.2, 0.8), () => {
    const rg = x.createRadialGradient(lx, ly, 0, lx, ly, 320);
    rg.addColorStop(0, 'rgba(53,214,198,0.28)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = rg; x.fillRect(lx - 400, ly - 400, 800, 800);
  });
  scaleAt(lx, ly, 0.6 + 0.4 * a, () => drawLogo(lx, ly, ls + Math.sin(lt * 2) * 4, p(lt, 0.2, 0.7)));
  const b = eo(p(lt, 1.0, 1.8));
  text('Conversa', lx, (S ? 930 : 660) + (1 - b) * 30, S ? 132 : 128, { w: 700, alpha: b });
  const c = eo(p(lt, 1.6, 2.4));
  text('Der dezentrale Messenger für deine Privatsphäre', lx, (S ? 1065 : 760) + (1 - c) * 20, 44,
    { color: C.muted, alpha: c, maxW: S ? 860 : 0 });
  const chips = ['Ende-zu-Ende-verschlüsselt', 'Dezentral', 'Open Source', 'Nur für Android'];
  font(28, 500);
  const ws = chips.map(s => x.measureText(tr(s)).width + 50), gap = S ? 36 : 70;
  const rows = S ? [[0, 1], [2, 3]] : [[0, 1, 2, 3]], rowY = S ? [1240, 1330] : [870];
  const xs = [], ys = [];
  rows.forEach((row, ri) => {
    let cx0 = W / 2 - (row.reduce((s2, i) => s2 + ws[i], 0) + gap * (row.length - 1)) / 2;
    row.forEach(i => { xs[i] = cx0 + ws[i] / 2; ys[i] = rowY[ri]; cx0 += ws[i] + gap; });
  });
  chips.forEach((s, i) => {
    const d = back(p(lt, 2.4 + i * 0.25, 3.0 + i * 0.25));
    withAlpha(p(lt, 2.4 + i * 0.25, 2.8 + i * 0.25), () => scaleAt(xs[i], ys[i], 0.7 + 0.3 * d, () => pill(xs[i], ys[i], s, 28,
      i === 3 ? { stroke: C.android, fill: 'rgba(61,220,132,0.16)', w: 600 } : {})));
  });
}

function sceneLogin(lt) {
  title(lt, 'Anmelden ohne persönliche Daten', 'Kein Konto bei einem Anbieter – nur Benutzername und Passwort');
  const ph = eo(p(lt, 0.2, 1.0));
  x.save(); x.translate(0, (1 - ph) * 60); x.globalAlpha *= ph;
  phone(S ? 540 : 600, S ? 880 : 640, S ? 300 : 340, S ? 600 : 680, (sx, sy, sw, sh) => {
    drawLogo(sx + sw / 2, sy + 110, 96);
    text('Conversa', sx + sw / 2, sy + 190, 32, { w: 700 });
    const field = (y, label, value, active) => {
      text(label, sx + 30, y - 18, 18, { color: C.muted, align: 'left' });
      rr(sx + 28, y, sw - 56, 56, 12); x.fillStyle = '#16293d'; x.fill();
      x.lineWidth = 2; x.strokeStyle = active ? C.cyan : '#2a4560'; x.stroke();
      text(value, sx + 46, y + 29, 24, { align: 'left', w: 500 });
      if (active && Math.floor(lt * 2.5) % 2 === 0) {
        font(24, 500); const cw = x.measureText(value).width;
        x.fillStyle = C.cyan; x.fillRect(sx + 48 + cw, y + 14, 2.5, 30);
      }
    };
    const user = 'alex', n1 = Math.floor(clamp((lt - 0.9) / 0.9) * user.length);
    const n2 = Math.floor(clamp((lt - 2.0) / 1.0) * 10);
    field(sy + 270, 'Benutzername', user.slice(0, n1), lt < 1.95);
    field(sy + 380, 'Passwort', '•'.repeat(n2), lt >= 1.95 && lt < 3.2);

function renderAt(t) {
  t = clamp(t, 0, DUR);
  x.save();
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalAlpha = 1;
  background(t);
  for (const [a, b, fn, k] of SCENES) {
    if (t < a || t > b) continue;
    const lt = t - a, d = b - a;
    const fin = a === 0 ? 1 : p(lt, 0, 0.45);
    const fout = b === DUR ? 1 : 1 - p(lt, d - 0.45, d);
    const al = Math.min(fin, fout);
    if (al <= 0) continue;
    x.save(); x.globalAlpha = al; fn(lt / k, d / k); x.restore();
  }
  watermark(t);
  const fade = Math.max(1 - p(t, 0, 0.5), p(t, DUR - 0.7, DUR));
  if (fade > 0) { x.fillStyle = `rgba(0,0,0,${fade})`; x.fillRect(0, 0, W, H); }
  x.restore();
}

fmtSel.value = S ? 'short' : 'wide';
fmtSel.onchange = () => { const q = new URLSearchParams(location.search); if (fmtSel.value === 'short') q.set('format', 'short'); else q.delete('format'); location.search = q.toString(); };
if (LANG === 'en') btn.textContent = 'Play';
function setTime(t) {
  cur = t; t0 = performance.now() - t * 1000;
  if (audio) { try { audio.currentTime = t; } catch (e) {} }
}
function setPlaying(on) {
  playing = on;
  btn.textContent = on ? 'Pause' : (LANG === 'en' ? 'Play' : 'Abspielen');
  if (audio) { if (on) audio.play().catch(() => {}); else audio.pause(); }
}
btn.onclick = () => {
  if (!playing && cur >= DUR) setTime(0); else setTime(cur);
  setPlaying(!playing);
};
seek.oninput = () => { setTime(+seek.value); renderAt(cur); };
function loop(now) {
  if (playing) {
    cur = audio && !audio.paused && !isNaN(audio.duration) ? audio.currentTime : (now - t0) / 1000;
    if (cur >= DUR) { cur = DUR; setPlaying(false); }
    renderAt(cur);
    seek.value = cur;
  }
  tl.textContent = `${cur.toFixed(1).replace('.', ',')} / ${DUR.toFixed(1).replace('.', ',')} s`;
  requestAnimationFrame(loop);
}

Promise.all([document.fonts.ready, logo.decode().catch(() => {})]).then(() => {
  window.__ready = true;
  renderAt(RENDER ? 0 : 3.5);
  if (!RENDER) { cur = 0; requestAnimationFrame(loop); }
});
</script>
</body>
